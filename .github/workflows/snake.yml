name: Generate Snake

# Змейка ползёт по твоему календарю контрибуций и съедает квадратики.
# Картинка складывается в ветку output и НЕ зависит от сторонних серверов —
# поэтому, в отличие от stats-карточек, никогда не отваливается.

on:
  schedule:
    - cron: "0 */12 * * *"   # обновление дважды в сутки
  workflow_dispatch:          # и кнопкой вручную во вкладке Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#0b5fa5

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
